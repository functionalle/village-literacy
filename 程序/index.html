<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>乡村识字</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="打开菜单">☰</button>
        <div class="brand"><span class="brand-mark">字</span><span>乡村识字</span></div>
        <button class="mode-btn" id="modeBtn"><span class="mode-dot"></span><span id="modeLabel">儿童端</span></button>
      </header>

      <section class="dashboard" aria-label="学习进度">
        <div class="welcome-row">
          <div>
            <p class="eyebrow" id="greeting">今天也来认几个字</p>
            <h1>一年级上册</h1>
          </div>
          <div class="streak"><span class="streak-icon">✦</span><strong id="streakValue">0</strong><span>天</span></div>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <div class="progress-meta"><span>本册进度</span><strong><span id="learnedCount">0</span> / <span id="totalCount">24</span> 字</strong></div>
      </section>

      <section class="task-card">
        <div class="task-topline"><span class="pill">今日任务</span><span id="taskStatus">还差 3 个字</span></div>
        <div class="task-main"><div class="task-number" id="taskNumber">03</div><div><h2>认字小练习</h2><p>新字 + 复习各几个</p></div><button class="primary-btn" id="startBtn">开始学习 <span>→</span></button></div>
      </section>

      <section class="learn-panel" id="learnPanel">
        <div class="section-heading"><div><span class="section-kicker">正在学习</span><h2 id="charTitle">人</h2></div><span class="card-index" id="cardIndex">1 / 3</span></div>
        <div class="card-stage">
          <div class="char-card">
            <div class="char" id="charText">人</div>
            <div class="pinyin" id="pinyinText">rén</div>
            <div class="word" id="wordText">大人 · 人们</div>
            <button class="sound-btn" id="soundBtn" aria-label="播放发音"><span>◖</span> 播放发音</button>
          </div>
          <div class="stroke-card"><div class="stroke-header"><span>笔顺</span><button class="mini-btn" id="animateBtn">演示</button></div><svg viewBox="0 0 120 120" id="strokeSvg" aria-label="笔顺动画"><path class="stroke-guide" d="M20 18 L100 18 M60 20 L60 94 M28 92 Q60 70 96 98"/><path class="stroke-live" id="strokeOne" d="M20 18 L100 18"/><path class="stroke-live" id="strokeTwo" d="M60 20 L60 94"/><path class="stroke-live" id="strokeThree" d="M28 92 Q60 70 96 98"/></svg><span class="stroke-caption">共 <b id="strokeCount">3</b> 笔</span></div>
        </div>
        <div class="action-row"><button class="secondary-btn" id="readBtn"><span>◉</span> 跟读</button><button class="secondary-btn" id="traceBtn"><span>✎</span> 描一描</button><button class="secondary-btn" id="nextBtn">下一个 <span>→</span></button></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </section>

      <section class="review-strip"><div class="review-icon">↻</div><div><strong>复习提醒</strong><p id="reviewText">今天还没有需要复习的字</p></div><button class="text-btn" id="reviewBtn">去复习 <span>→</span></button></section>

      <nav class="bottom-nav"><button class="nav-item active"><span>⌂</span><small>学习</small></button><button class="nav-item" id="cardsNav"><span>▦</span><small>字卡</small></button><button class="nav-item" id="statsNav"><span>◒</span><small>进度</small></button><button class="nav-item" id="settingsNav"><span>⚙</span><small>设置</small></button></nav>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="traceOverlay" aria-hidden="true"><div class="trace-modal"><div class="modal-head"><h2>描一描 · <span id="traceChar">人</span></h2><button class="icon-btn" id="closeTrace" aria-label="关闭">×</button></div><canvas id="traceCanvas" width="620" height="620"></canvas><div class="trace-actions"><button class="secondary-btn" id="clearTrace">清除</button><button class="primary-btn" id="finishTrace">完成</button></div></div></div>
    <div class="overlay" id="menuOverlay" aria-hidden="true"><div class="side-menu"><div class="modal-head"><h2>乡村识字</h2><button class="icon-btn" id="closeMenu" aria-label="关闭">×</button></div><div class="menu-profile"><div class="avatar">小</div><div><strong id="profileMode">儿童端</strong><p>学习进度保存在本机</p></div></div><button class="menu-link" id="resetBtn">重置本机进度 <span>↺</span></button><div class="menu-note">无广告 · 无弹窗 · 离线可用</div></div></div>
    <script src="app.js"></script>
  </body>
</html>
